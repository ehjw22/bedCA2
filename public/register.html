<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Challenge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/loginNRegister.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./images/galaxy.png" alt="" width="32">
        Wellness Quest
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="plants.html">Plants</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="planets.html">Planets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="leaderboard.html">Leaderboard</a>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a id="loginButton" class="nav-link" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a id="registerButton" class="nav-link active" href="register.html">Register</a>
          </li>
          <li class="nav-item">
            <a id="profileButton" class="nav-link d-none" href="profile.html">Profile</a>
          </li>
          <li class="nav-item">
            <a id="logoutButton" class="nav-link d-none" href="#">Logout</a>
          </li>
        </ul>

      </div>
    </div>
    </nav>

    <main class="flex-grow-1 container-md">
        <section class="d-flex align-items-center justify-content-center py-5">
            <div class="container" style="max-width: 480px;" id="registerSection">
                <div class="p-5">
                    <h2 class="text-center mb-4 glow">Create Your Account</h2>
                    <p class="text-center mb-4" style="color: #cfd3ff;">
                    Start your wellness journey and explore your galaxy
                    </p>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="you@example.com" required/>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="spaceExplorer" required/>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required/>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required/>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn bg-warning btn-lg" id="registerSubmitBtn">Sign Up</button>
                        </div>
                    </form>
                    <div id="warningCard" class="card border-danger mb-3 d-none mt-3">
                        <div class="card-body text-danger">
                            <p id="warningText" class="card-text"></p>
                        </div>
                    </div>

                    <p class="text-center mt-4" style="color: #cfd3ff;">
                    Already have an account?
                    <a href="login.html">Log in</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-3">
        <small>© 2026 Wellness Quest · Build habits, explore galaxies</small>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/getCurrentURL.js" type="text/javascript"></script>
    <script src="js/queryCmds.js" type="text/javascript"></script>
    <script src="js/register.js" type="text/javascript"></script>
    <script src="js/userNavbarToggle.js" type="text/javascript"></script>
</body>
</html>
